name: Build Rihlat 75 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip Rihlat75_CloudBuild_Project.zip -d extracted

      - name: Build APK
        working-directory: extracted/Rihlat75
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Rihlat75-APK
          path: extracted/Rihlat75/app/build/outputs/apk/debug/app-debug.apk
